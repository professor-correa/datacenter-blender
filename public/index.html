<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PILOTO - DATACENTER 3D</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap");
    :root {
      --senai-red: #e30613;
      --senai-dark: #1d1f23;
      --senai-gray: #f2f4f7;
      --text: #111827;
      --muted: #4b5563;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Barlow", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 20%, rgba(227, 6, 19, 0.12), transparent 40%), radial-gradient(circle at 80% 10%, rgba(0, 0, 0, 0.08), transparent 40%), var(--senai-gray);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(960px, 100%);
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      padding: 40px 48px;
      display: grid;
      gap: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 3vw, 38px);
      letter-spacing: 0.04em;
      color: var(--senai-dark);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 720px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .button {
      padding: 18px 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.07);
      background: linear-gradient(135deg, #ffffff, #f7f8fb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(227, 6, 19, 0.35);
      box-shadow: 0 12px 30px rgba(227, 6, 19, 0.18);
    }
    .button span {
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(227, 6, 19, 0.12);
      color: var(--senai-red);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>PILOTO - DATACENTER 3D</h1>
      <p>Três visualizações independentes dos modelos GLB exportados do Blender. Escolha uma cena para abrir o exemplo em Three.js.</p>
    </header>
    <section class="actions">
      <a href="model-one.html" class="button">
        <span>Visualizar Base One</span>
        <span class="badge">GLB</span>
      </a>
      <a href="model-two.html" class="button">
        <span>Visualizar Base Two</span>
        <span class="badge">GLB</span>
      </a>
      <a href="model-three.html" class="button">
        <span>Visualizar Base Three</span>
        <span class="badge">GLB</span>
      </a>
    </section>
  </main>
</body>
</html>
