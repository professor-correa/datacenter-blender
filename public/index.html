<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PILOTO - DATACENTER 3D</title>
  <style>
    :root {
      --bg: #0f1116;
      --card: #171b23;
      --accent: #3abff8;
      --text: #e8ecf5;
      --muted: #9aa3b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1c2230, #0f1116 45%), radial-gradient(circle at 80% 0%, #1e2634, transparent 40%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(960px, 100%);
      background: linear-gradient(145deg, #1b202c, #141923);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      border-radius: 16px;
      padding: 40px 48px;
      display: grid;
      gap: 32px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 36px);
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 720px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .button {
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(58, 191, 248, 0.4);
      box-shadow: 0 10px 30px rgba(58, 191, 248, 0.12);
    }
    .button span {
      font-weight: 600;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(58, 191, 248, 0.16);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>PILOTO - DATACENTER 3D</h1>
      <p>Três visualizações independentes dos modelos GLB exportados do Blender. Escolha uma cena para abrir o exemplo em Three.js.</p>
    </header>
    <section class="actions">
      <a href="model-one.html" class="button">
        <span>Visualizar Base One</span>
        <span class="badge">GLB</span>
      </a>
      <a href="model-two.html" class="button">
        <span>Visualizar Base Two</span>
        <span class="badge">GLB</span>
      </a>
      <a href="model-three.html" class="button">
        <span>Visualizar Base Three</span>
        <span class="badge">GLB</span>
      </a>
    </section>
  </main>
</body>
</html>
