<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelo Base One - Datacenter 3D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f9;
      color: #111827;
      overflow: hidden;
    }
    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      color: #0f172a;
      font-weight: 600;
      font-size: 12px;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(243, 245, 249, 0.72) 100%);
      backdrop-filter: blur(8px);
      z-index: 10;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    header a {
      color: #0f8ed7;
      text-decoration: none;
      font-weight: 600;
    }
    #scene {
      width: 100vw;
      height: calc(100vh - 56px);
      margin-top: 56px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <header>
    <h1>PILOTO - DATACENTER 3D · Base One</h1>
    <a href="index.html">Voltar</a>
  </header>
  <div id="scene"></div>
  <div id="status">Carregando cena...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const container = document.getElementById("scene");
    const statusEl = document.getElementById("status");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f5f9);

    const sizes = {
      width: window.innerWidth,
      height: window.innerHeight - 56
    };

    const camera = new THREE.PerspectiveCamera(60, sizes.width / sizes.height, 0.1, 1000);
    camera.position.set(4, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(sizes.width, sizes.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcfd5e3, 1.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(6, 10, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const loader = new GLTFLoader();
    loader.load(
      "models/base-one.glb",
      (gltf) => {
        const model = gltf.scene;
        model.traverse((child) => {
          if (child.isMesh) child.castShadow = child.receiveShadow = true;
        });
        scene.add(model);
        frameObject(model);
        statusEl.textContent = "Modelo carregado";
        setTimeout(() => statusEl.remove(), 1200);
      },
      (xhr) => {
        const loaded = xhr.loaded ?? 0;
        const total = xhr.total ?? 0;
        if (total > 0) {
          const pct = Math.min(100, Math.round((loaded / total) * 100));
          statusEl.textContent = `Carregando modelo... ${pct}%`;
        } else {
          statusEl.textContent = "Carregando modelo...";
        }
      },
      (error) => {
        console.error("Erro ao carregar o modelo:", error);
        statusEl.textContent = "Erro ao carregar modelo (veja console).";
      }
    );

    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const fitHeightDistance = maxDim / (2 * Math.atan((Math.PI * camera.fov) / 360));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = Math.max(fitHeightDistance, fitWidthDistance);

      const direction = new THREE.Vector3()
        .subVectors(camera.position, controls.target)
        .normalize()
        .multiplyScalar(distance * 1.2);

      camera.position.copy(center).add(direction);
      controls.target.copy(center);
      controls.update();
    }

    function onResize() {
      sizes.width = window.innerWidth;
      sizes.height = window.innerHeight - 56;
      camera.aspect = sizes.width / sizes.height;
      camera.updateProjectionMatrix();
      renderer.setSize(sizes.width, sizes.height);
    }
    window.addEventListener("resize", onResize);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
